# SQLite Configuration
spring.datasource.url=jdbc:sqlite:projetRO.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=api.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=votre_secret_jwt
jwt.expiration=86400000

# Flyway Configuration (disable for SQLite migration)
spring.flyway.enabled=false

# API Base URL
api.base.url=http://localhost:8080

# Autoriser la surcharge des définitions de beans
spring.main.allow-bean-definition-overriding=true
